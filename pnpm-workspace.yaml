allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  tree-sitter-bash: true
  tree-sitter-powershell: true
  workerd: true

minimumReleaseAge: 0

overrides:
  "@ai-sdk/provider-utils@>=4.0.0 <4.0.33": "4.0.33"
  "undici@>=7.0.0 <7.29.1": "7.29.1"

minimumReleaseAgeExclude:
  # Keep the SDK, plugin, and their provider packages on compatible releases.
  - "@opencode/*"
  - "@ai-sdk/*"
  - "ai"
  - "js-yaml@3.15.2"
pmOnFail: ignore
