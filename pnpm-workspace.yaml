allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  tree-sitter-bash: true
  tree-sitter-powershell: true
  workerd: true

minimumReleaseAge: 0
minimumReleaseAgeExclude:
  # The official Workerd SDK is currently published only on OpenCode's dev
  # channel and intentionally tracks matching, newly published provider builds.
  - "@opencode-ai/*"
  - "@ai-sdk/*"
  - "ai"
  - "js-yaml@3.15.2"
pmOnFail: ignore
