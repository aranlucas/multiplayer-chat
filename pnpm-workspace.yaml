allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  tree-sitter-bash: true
  tree-sitter-powershell: true
  workerd: true

minimumReleaseAge: 0
minimumReleaseAgeExclude:
  # Keep the SDK, plugin, and their provider packages on compatible releases.
  - "@opencode/*"
  - "@ai-sdk/*"
  - "ai"
  - "js-yaml@3.15.2"
pmOnFail: ignore
